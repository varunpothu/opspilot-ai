name: OpsPilot AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check --select E4,E7,E9,F --ignore F401 src tests
      - name: Test
        run: pytest -q
      - name: Run fixture benchmark
        run: opspilot-benchmark --fixtures examples/ops_cases --output artifacts/opspilot_fixture_benchmark.json
      - name: Upload fixture benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: opspilot-fixture-benchmark-python-${{ matrix.python-version }}
          path: artifacts/opspilot_fixture_benchmark.json
          if-no-files-found: error
          retention-days: 30
